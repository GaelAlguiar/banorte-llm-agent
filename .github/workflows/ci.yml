name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests/cv_agent -q
      - run: python -m cv_agent.evaluation.runner
      - name: Detect tracked secrets and private paths
        shell: bash
        run: |
          ! git grep -nE 'sk-(proj-)?[A-Za-z0-9_-]{20,}|/Users/[A-Za-z0-9._-]+/' -- ':!tests/**' ':!evals/**' ':!.github/**'
          ! git grep -nE -- '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' -- ':!tests/**' ':!.github/**'
      - run: docker build -t gael-cv-agent:${{ github.sha }} .
